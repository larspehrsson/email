name: build

# Every action is pinned to a commit (its tag in a comment), and Rust to a version: the bundle
# jobs hold the update-signing and Apple keys, so nothing they run may change under a moved tag.
# To update one, look up the tag's commit (gh api repos/OWNER/REPO/commits/TAG -q .sha).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run at a time per branch: a newer push waits, so the "latest" release never mixes two
# builds' files (and latest.json names the files beside it).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # The Tauri crate needs the built frontend (app/dist) to compile; it's built in
      # the bundle job. The tests live in the core and CLI crates.
      - run: cargo test --workspace --exclude mail-app
      # The sync engine against real servers: Dovecot (IMAP) and Mailpit (SMTP) in Docker.
      - name: Server tests
        run: |
          eval "$(test-server/test-server.sh up)"
          cargo test -p mail-core --test server
      - name: Server logs
        if: failure()
        run: docker logs mail-test-dovecot 2>&1 | tail -100; docker logs mail-test-mailpit 2>&1 | tail -50
      # The frontend: plain logic in Node (app/scripts/unit-tests.js), and the UI against its mock
      # backend in the runner's Google Chrome (app/scripts/ui-tests.js).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Frontend tests
        working-directory: app
        run: |
          npm ci
          npm run test:unit
          npm run test:ui

  bundle:
    needs: test
    # Publishing to the "latest" release (below) needs to write to the repository.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on an older Ubuntu so the binaries also run on newer distributions
          # (the artifact has .rpm for Fedora, .deb for Debian/Ubuntu, and an AppImage).
          - os: ubuntu-22.04
            platform: linux
            args: ""
            bundle: target/release/bundle
          - os: macos-latest
            platform: macos
            args: "--target universal-apple-darwin"
            bundle: target/universal-apple-darwin/release/bundle
          # An NSIS installer (.exe) and an .msi; unsigned (SmartScreen asks once).
          - os: windows-latest
            platform: windows
            args: ""
            bundle: target/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The whole history: the version counts the commits.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.99.1
          # Both architectures for a universal macOS binary.
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # aws-lc-sys (rustls' crypto) assembles with NASM on x86_64 Windows.
      - name: NASM
        if: startsWith(matrix.os, 'windows')
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1

      # Version = major.minor from tauri.conf.json + the number of commits as the patch: the
      # same for a commit on every platform and in local builds (see app/src-tauri/build.rs),
      # and higher with every commit (dnf/rpm and macOS see it as an update). Bump major.minor
      # in tauri.conf.json by hand. Written into the config here for the bundles' metadata.
      - name: Set version
        shell: bash
        run: |
          f=app/src-tauri/tauri.conf.json
          base=$(node -p "require('./$f').version")
          v="${base%.*}.$(git rev-list --count HEAD)"
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('$f'));c.version='$v';fs.writeFileSync('$f',JSON.stringify(c,null,2)+'\n')"
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "Building version $v"

      # Updates (app/src-tauri/src/updater.rs): with the TAURI_SIGNING_PRIVATE_KEY secret (and
      # its password) and the TAURI_UPDATER_PUBKEY variable set, the build signs its update
      # files (.sig beside each) and the app gets the updater's configuration: the public key,
      # and latest.json on this repository's "latest" release (written by the release job).
      # Without them (pull requests from forks, other repositories) the app doesn't update itself.
      - name: Updater
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$KEY" ] || [ -z "$PUBKEY" ]; then
            echo "No updater key: this build doesn't update itself"
            exit 0
          fi
          {
            echo "TAURI_SIGNING_PRIVATE_KEY=$KEY"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          f=app/src-tauri/tauri.conf.json
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('$f'));
            c.bundle.createUpdaterArtifacts = true;
            c.plugins.updater = {
              pubkey: process.env.PUBKEY,
              endpoints: ['https://github.com/' + process.env.REPO + '/releases/download/latest/latest.json'],
              windows: { installMode: 'passive' },
            };
            fs.writeFileSync('$f', JSON.stringify(c, null, 2) + '\n');
          "
          echo "Updates on, from $REPO"

      # macOS signing and notarization (https://v2.tauri.app/distribute/sign/macos/): with the
      # APPLE_* secrets set, the Tauri build imports the Developer ID certificate into a
      # temporary keychain, signs, notarizes and staples. Without them (forks) the build is
      # signed ad-hoc ("-"): not notarized, but a signature that names the app by its bundle
      # identifier. Left at the linker's bare signature, it's named "mail_app", and macOS
      # refuses notifications to an app asking as dev.mailclient.desktop. Tauri takes an empty
      # variable as set, so the rest are only exported when there.
      - name: Apple signing
        if: startsWith(matrix.os, 'macos')
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [ -z "$CERTIFICATE" ]; then
            echo "No Apple secrets: signed ad-hoc"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$API_PRIVATE_KEY" > "$key"
          {
            echo "APPLE_CERTIFICATE=$CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY"
            echo "APPLE_API_ISSUER=$API_ISSUER"
            echo "APPLE_API_KEY=$API_KEY"
            echo "APPLE_API_KEY_PATH=$key"
          } >> "$GITHUB_ENV"

      - name: Build
        working-directory: app
        run: |
          npm ci
          npm run tauri build -- ${{ matrix.args }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        # The release below is what's for downloading: don't let this service stop it.
        continue-on-error: true
        with:
          name: email-${{ matrix.platform }}-${{ env.APP_VERSION }}
          path: |
            ${{ matrix.bundle }}/deb/*.deb
            ${{ matrix.bundle }}/rpm/*.rpm
            ${{ matrix.bundle }}/appimage/*.AppImage
            ${{ matrix.bundle }}/dmg/*.dmg
            ${{ matrix.bundle }}/nsis/*.exe
            ${{ matrix.bundle }}/msi/*.msi
            ${{ matrix.bundle }}/*/*.sig
            ${{ matrix.bundle }}/macos/*.app.tar.gz
          if-no-files-found: ignore

      # Every build of main: its files on the "latest" pre-release, as plain downloads with
      # stable links (artifacts come zipped, need a login, expire, and their download service
      # fails at times). Each platform replaces only its own files there. With the updater key,
      # also the update files: each installer's signature (.sig), and macOS's Email.app.tar.gz.
      - name: Publish to the latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
          BUNDLE: ${{ matrix.bundle }}
        run: |
          shopt -s nullglob
          files=("$BUNDLE"/deb/*.deb "$BUNDLE"/rpm/*.rpm "$BUNDLE"/appimage/*.AppImage "$BUNDLE"/dmg/*.dmg "$BUNDLE"/nsis/*.exe "$BUNDLE"/msi/*.msi
                 "$BUNDLE"/*/*.sig "$BUNDLE"/macos/*.app.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then echo "nothing to publish"; exit 0; fi
          # The first build creates the release (the platforms may try at once: one wins).
          gh release view latest >/dev/null 2>&1 \
            || gh release create latest --prerelease --target "$GITHUB_SHA" --title "Latest build" \
                 --notes "The newest build of main. Unsigned on Linux and Windows; on macOS signed and notarized when built with the Apple secrets, otherwise signed ad-hoc." \
            || gh release view latest >/dev/null
          for a in $(gh release view latest --json assets --jq '.assets[].name'); do
            case "$PLATFORM:$a" in
              macos:*.dmg | macos:*.app.tar.gz | macos:*.app.tar.gz.sig \
              | linux:*.deb | linux:*.deb.sig | linux:*.rpm | linux:*.rpm.sig | linux:*.AppImage | linux:*.AppImage.sig \
              | windows:*.exe | windows:*.exe.sig | windows:*.msi | windows:*.msi.sig) gh release delete-asset latest "$a" --yes ;;
            esac
          done
          gh release upload latest "${files[@]}" --clobber

  # The "latest" tag and notes follow the commit just published.
  release:
    needs: bundle
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Point the latest release at this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          v="${base%.*}.$(git rev-list --count HEAD)"
          git push --force origin "$GITHUB_SHA:refs/tags/latest"
          gh release edit latest --prerelease --title "Latest build ($v)" \
            --notes "Version $v, built from ${GITHUB_SHA:0:7}. Unsigned on Linux and Windows; on macOS signed and notarized when built with the Apple secrets, otherwise signed ad-hoc."
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"

      # What the apps ask for to update themselves (app/src-tauri/src/updater.rs): this version,
      # and for each platform and kind of install the file and its signature, all on this
      # release. Only when the build signed its files (the updater key is set).
      - name: Publish latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          dir="$RUNNER_TEMP/sigs"
          mkdir -p "$dir"
          gh release download latest --pattern '*.sig' --dir "$dir" --clobber || true
          if ! ls "$dir"/*.sig >/dev/null 2>&1; then
            echo "No signatures: no update files"
            exit 0
          fi
          node .github/latest-json.js "$dir" "$APP_VERSION" "${GITHUB_SHA:0:7}" "https://github.com/$REPO/releases/download/latest" > "$RUNNER_TEMP/latest.json"
          cat "$RUNNER_TEMP/latest.json"
          gh release upload latest "$RUNNER_TEMP/latest.json" --clobber

      # The notes: a download table grouped by system, from the files now on the release
      # (GitHub lists the assets flat and alphabetically; the notes show above them).
      - name: Release notes
        # Cosmetic, after the release is published: a failure keeps the plain notes, and
        # doesn't fail the build.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAC_SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          gh release view latest --json assets | node .github/release-notes.js "$APP_VERSION" "$GITHUB_SHA" "$REPO" "$MAC_SIGNED" "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          gh release edit latest --notes-file "$RUNNER_TEMP/notes.md"
